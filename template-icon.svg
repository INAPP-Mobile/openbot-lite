    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- antenna -->
  <rect x="118" y="40" width="20" height="8" rx="4" fill="#334155"/>
  <circle cx="128" cy="34" r="10" fill="url(#eye)"/>
  <!-- head -->
  <rect x="52" y="72" width="152" height="116" rx="30" fill="#E2E8F0"/>
  <!-- eyes -->
  <circle cx="96" cy="124" r="17" fill="url(#eye)"/>
  <circle cx="160" cy="124" r="17" fill="url(#eye)"/>
  <!-- mouth / status bar -->
  <rect x="96" y="152" width="64" height="10" rx="5" fill="#94A3B8"/>
  <!-- shoulders -->
  <rect x="72" y="196" width="112" height="20" rx="10" fill="#475569"/>
</svg>
